apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: dev
  labels:
    app: user-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
      - name: user-service
        image: mohamedlouay/user-service:latest  # <-- Remplace par ton image Docker
        ports:
        - containerPort: 5000
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        env:
        - name: MONGO_URI
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: MONGO_URI
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: SECRET_KEY
---
apiVersion: v1
kind: Service
metadata:
  name: user-service-svc
  namespace: dev
spec:
  type: NodePort
  selector:
    app: user-service
  ports:
    - protocol: TCP
      port: 80         # Port interne du cluster
      targetPort: 5000 # Port exposé par le container Flask
      nodePort: 30050  # Port externe exposé sur les nœuds (modifiable)
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: dev
type: Opaque
stringData:
  MONGO_URI: "mongodb://louaymoncef:isetch@10.9.21.20:30017/product-db"
  SECRET_KEY: "devops2024!@#"
